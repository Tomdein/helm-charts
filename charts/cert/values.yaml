# https://cloudnative-pg.io/docs/devel/certificates#cert-manager-example-1:~:text=size%3A%201Gi-,You%20can%20find%20a%20complete%20example%20using%20cert%2Dmanager%20to%20manage%20both%20server%20and%20client%20CA%20and%20certificates%20in%20the%20cluster%2Dexample%2Dcert%2Dmanager.yaml%20deployment%20manifest.,-Client%20certificate%E2%80%8B
# https://cloudnative-pg.io/docs/assets/files/cluster-example-cert-manager-70006d78c99f9f121cfba3e797e5f728.yaml

namespace: cluster-certs

certificate:
  # usages:
  # commonName:
  name: certificate-name
  secretName: cluster-cert-secret-name
  dnsName: yourapp.yournamespace.svc.cluster.local
  ipAddresses:
    - 127.0.0.1
    - ::1
  issuerRef:
    name: cluster-issuer-server # cluster-issuer-server or cluster-issuer-client for self-signed certificates
    kind: ClusterIssuer
    group: cert-manager.io

  duration: 720h # 720h = 30d
  renewBefore: 168h # 168h = 7d
  isCa: false
